<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0b0620">
    <title>ASTRO LEAP — Plataformas + Duelos por turnos</title>
    <meta name="description" content="Salta entre restos flotantes, gestiona tu energía entre el doble salto y el combate, escapa de un núcleo que colapsa, y derrota a los guardianes de dos lunas alienígenas y una estación abandonada. Un híbrido de plataformas y JRPG por turnos, jugable en móvil y escritorio.">

    <!-- URLs ABSOLUTAS a propósito: los scrapers de Open Graph (X, WhatsApp, Facebook...) leen
         el HTML crudo sin ejecutar JS ni resolver rutas relativas, así que og:image/og:url no
         pueden ser relativas ni calcularse en runtime. Si el juego cambia de dominio hay que tocar
         este bloque y WEB_HOME en js/game.js (la URL que comparte la build de escritorio) — los
         botones de compartir en web usan location.href y se adaptan solos (ver Game.buildShareHTML). -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://astroleap.enri.me/">
    <meta property="og:title" content="ASTRO LEAP — Plataformas + Duelos por turnos">
    <meta property="og:description" content="Salta entre restos flotantes y decide: ¿usas tu energía para un doble salto arriesgado, o la guardas para el próximo duelo? 12 sectores, incluido uno de scroll forzado donde el núcleo te persigue.">
    <meta property="og:image" content="https://astroleap.enri.me/og-image.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="ASTRO LEAP — Plataformas + Duelos por turnos">
    <meta name="twitter:description" content="Un híbrido de plataformas y combate por turnos ambientado en dos lunas alienígenas y una estación que se autodestruye.">
    <meta name="twitter:image" content="https://astroleap.enri.me/og-image.png">

    <link rel="canonical" href="https://astroleap.enri.me/">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%80%3C/text%3E%3C/svg%3E">

    <!-- Fuentes autoalojadas en fonts/ (declaradas en style.css) — sin Google Fonts: la build
         de escritorio funciona offline y la web no visita servidores de terceros. -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="audioControls">
        <button id="btnMusicToggle" class="audio-btn" aria-label="Música">
            <svg class="icon-on" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 17V4.5L20 3v12.5"/><circle cx="6.5" cy="17" r="2.8"/><circle cx="17.5" cy="15.5" r="2.8"/></svg>
            <svg class="icon-off" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 17V4.5L20 3v12.5"/><circle cx="6.5" cy="17" r="2.8"/><circle cx="17.5" cy="15.5" r="2.8"/><line x1="3" y1="3" x2="21" y2="21" stroke-width="2.4"/></svg>
        </button>
        <button id="btnSfxToggle" class="audio-btn" aria-label="Sonido">
            <svg class="icon-on" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5h4L12.5 5v14L7 14.5H3z" fill="currentColor" stroke="none"/><path d="M16 8.5a5 5 0 0 1 0 7"/><path d="M18.7 6a9 9 0 0 1 0 12"/></svg>
            <svg class="icon-off" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5h4L12.5 5v14L7 14.5H3z" fill="currentColor" stroke="none"/><line x1="16" y1="9" x2="21.5" y2="14.5"/><line x1="21.5" y1="9" x2="16" y2="14.5"/></svg>
        </button>
        <!-- Accesibilidad: reduce/anula el screen shake y el parpadeo de invulnerabilidad (ver
             Game.reduceEffects). Empieza APAGADO (a diferencia de música/sonido, que empiezan
             encendidos) — es un ajuste que se activa a propósito, no algo que se silencie. -->
        <button id="btnReduceFxToggle" class="audio-btn" aria-label="Reducir temblor y parpadeo">
            <svg class="icon-on" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l4-7 4 14 4-14 4 7 3-3"/></svg>
            <svg class="icon-off" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l4-7 4 14 4-14 4 7 3-3"/><line x1="3" y1="3" x2="21" y2="21" stroke-width="2.4"/></svg>
        </button>
    </div>
    <div id="gameContainer" class="menu-open">
        <canvas id="gameCanvas" width="320" height="180"></canvas>
        <button id="btnExit" aria-label="Salir del nivel">✕ Salir</button>
        <!-- Contenido generado por Game.buildMenuScreen(): arranque / Game Over / Victoria comparten la misma estructura de menú -->
        <div id="startScreen"></div>
    </div>

    <div id="moveControls">
        <div class="dpad">
            <button id="btnLeft" aria-label="Izquierda">◀</button>
            <button id="btnRight" aria-label="Derecha">▶</button>
        </div>
        <button id="btnJump" class="wide" aria-label="Saltar / Propulsor / Entrar">SALTO</button>
    </div>
    <div id="combatButtons">
        <button class="combat-btn" data-code="Digit1">1<span>Atacar</span></button>
        <!-- "Sobrecarga" es el texto por defecto de Kes (el piloto inicial) — Game.updateTouchUI()
             lo cambia por el nombre del piloto activo (ver HEROES.combatName en entities.js). -->
        <button class="combat-btn" data-code="Digit2">2<span>Sobrecarga</span></button>
        <button class="combat-btn" data-code="Digit3">3<span>Defender</span></button>
        <button class="combat-btn" data-code="Digit4">4<span>Huir</span></button>
    </div>

    <script src="js/audio.js"></script>
    <script src="js/entities.js"></script>
    <script src="js/levels.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
