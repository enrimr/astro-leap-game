<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASTRO LEAP — Plataformas + Duelos por turnos</title>
    <meta name="description" content="Salta entre restos flotantes, gestiona tu energía entre el doble salto y el combate, y derrota a los guardianes de dos lunas alienígenas. Un híbrido de plataformas y JRPG por turnos, jugable en móvil y escritorio.">

    <meta property="og:type" content="website">
    <meta property="og:title" content="ASTRO LEAP — Plataformas + Duelos por turnos">
    <meta property="og:description" content="Salta entre restos flotantes y decide: ¿usas tu energía para un doble salto arriesgado, o la guardas para el próximo duelo? Plataformas + JRPG por turnos.">
    <meta property="og:image" content="og-image.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="ASTRO LEAP — Plataformas + Duelos por turnos">
    <meta name="twitter:description" content="Un híbrido de plataformas y combate por turnos ambientado en dos lunas alienígenas.">
    <meta name="twitter:image" content="og-image.png">

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%80%3C/text%3E%3C/svg%3E">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="320" height="180"></canvas>
        <button id="btnExit" aria-label="Salir del nivel">✕ Salir</button>
        <div id="startScreen">
            <h1>ASTRO&nbsp;LEAP</h1>
            <p class="subtitle">2 lunas · 6 sectores · duelos de energía</p>
            <p class="hint blink-anim" id="startHint">PULSA ESPACIO PARA DESPEGAR</p>
            <p class="hint small">← → mover · ESPACIO saltar (2ª vez en el aire = propulsor) · ↑↓+ESPACIO o 1-4 en combate</p>
        </div>
    </div>

    <div id="moveControls">
        <button id="btnLeft" aria-label="Izquierda">◀</button>
        <button id="btnRight" aria-label="Derecha">▶</button>
        <button id="btnJump" class="wide" aria-label="Saltar / Propulsor / Entrar">SALTO</button>
    </div>
    <div id="combatButtons">
        <button class="combat-btn" data-code="Digit1">1<span>Atacar</span></button>
        <button class="combat-btn" data-code="Digit2">2<span>Habilidad</span></button>
        <button class="combat-btn" data-code="Digit3">3<span>Defender</span></button>
        <button class="combat-btn" data-code="Digit4">4<span>Huir</span></button>
    </div>

    <script src="js/audio.js"></script>
    <script src="js/entities.js"></script>
    <script src="js/levels.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
